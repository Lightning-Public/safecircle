  <text x="90" y="247" text-anchor="middle" class="small">서로 직접 확인</text>
</g>

<g transform="translate(855 300)">
  <circle cx="90" cy="90" r="78" fill="#FFF1F2"/><path d="M90 38l55 25v40c0 37-23 61-55 76-32-15-55-39-55-76V63z" fill="#F45C6B" opacity=".88"/><path d="M90 68v48M90 137v4" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
