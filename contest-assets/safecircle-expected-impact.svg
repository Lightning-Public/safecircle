<rect x="235" y="650" width="1130" height="120" rx="30" fill="#EAF7F1" stroke="#CDEBDD" stroke-width="2"/>
<text x="800" y="705" text-anchor="middle" style="font-size:31px;font-weight:850">평소에 쌓은 이해와 연결이, 위기의 순간에는 실제 대응력으로 이어집니다.</text>
<text x="800" y="748" text-anchor="middle" class="body">더 쉬운 소통 · 더 빠른 상태 확인 · 더 정확한 도움 연결</text>
