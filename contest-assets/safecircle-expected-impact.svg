  <text x="90" y="247" text-anchor="middle" class="small">말하고 듣기</text>
</g>

<g transform="translate(365 300)">
  <circle cx="90" cy="90" r="78" fill="#FFF7E8"/><circle cx="75" cy="86" r="34" fill="none" stroke="#F2B134" stroke-width="9"/><path d="M100 112l28 28" stroke="#F2B134" stroke-width="10" stroke-linecap="round"/>
