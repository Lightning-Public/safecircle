<text x="300" y="630" class="label">지역 지원기관</text>
<text x="300" y="673" class="body">통역 · 상담 · 생활지원</text>
<text x="300" y="708" class="body">사람의 도움이 필요한 영역</text>

<rect x="1040" y="565" width="430" height="205" rx="30" fill="#FFF1F2" stroke="#F3D4D7" stroke-width="2"/>
<circle cx="1130" cy="650" r="52" fill="#FFE1E4"/><path d="M1098 673h64M1107 673v-44M1122 673v-44M1138 673v-44M1153 673v-44M1095 629l35-22 35 22z" fill="none" stroke="#F45C6B" stroke-width="6" stroke-linejoin="round"/>
<text x="1210" y="630" class="label">공공기관 · 지자체</text>
<text x="1210" y="673" class="body">공식 재난·안전정보</text>
<text x="1210" y="708" class="body">행정·지원체계 연결</text>

<rect x="265" y="815" width="1070" height="52" rx="18" fill="#EAF7F1"/>
<text x="800" y="850" text-anchor="middle" class="body" style="font-weight:750">민간의 서비스 경험과 공공의 검증된 정보가 연결될 때, 현장의 대응력이 높아집니다.</text>
