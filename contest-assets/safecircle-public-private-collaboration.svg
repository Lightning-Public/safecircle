<text x="1210" y="313" class="body">현장 안전정보 제공</text>
<text x="1210" y="348" class="body">안내·교육 방식 개선</text>

<rect x="130" y="565" width="430" height="205" rx="30" fill="#EFFAF5" stroke="#CDEBDD" stroke-width="2"/>
