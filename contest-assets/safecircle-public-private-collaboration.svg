<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">민관협력 구조</title>
<desc id="d">시민·이주민, 사업장, 지원기관, 공공기관이 SafeCircle을 중심으로 연결되는 민관협력 구조도</desc>

<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#173052}
  .title{font-size:54px;font-weight:800}
  .subtitle{font-size:25px;font-weight:600;fill:#66758A}
  .label{font-size:28px;font-weight:800}
  .body{font-size:22px;font-weight:500}
  .small{font-size:19px;font-weight:600;fill:#66758A}
  .card{fill:#FFFFFF;stroke:#DCE6F1;stroke-width:2}
  .arrow{fill:none;stroke:#9DB2C7;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="1600" height="900" fill="#F7FAFD"/>
<g transform="translate(74 58) scale(1.15)">
