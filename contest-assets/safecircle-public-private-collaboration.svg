  <path d="M20 48c-5-3-8-9-8-15 0-5 2-10 6-14" fill="none" stroke="#35C98A" stroke-width="7" stroke-linecap="round"/>
</g></g>
<text x="160" y="105" class="title">민관협력 구조</text>
<text x="160" y="150" class="subtitle">SafeCircle은 기관을 대신하지 않고, 시민과 실제 지원체계 사이를 연결합니다.</text>

<path d="M800 420L390 285M800 420L1210 285M800 420L390 645M800 420L1210 645" class="arrow"/>

<rect x="575" y="280" width="450" height="280" rx="44" fill="#FFFFFF" stroke="#B9D3F4" stroke-width="3"/>
<g transform="translate(744 320) scale(1.75)">
<g id="safecircle-logo" transform="translate(0 0)">
  <circle cx="32" cy="32" r="30" fill="#F4F9FF"/>
  <circle cx="32" cy="12" r="7" fill="#2F80ED"/>
  <path d="M18 23c5-6 12-8 18-5 5 2 9 7 10 13" fill="none" stroke="#2F80ED" stroke-width="7" stroke-linecap="round"/>
  <circle cx="50" cy="35" r="7" fill="#F2B134"/>
  <path d="M44 49c-6 3-13 2-18-2-4-3-6-8-6-13" fill="none" stroke="#F2B134" stroke-width="7" stroke-linecap="round"/>
  <circle cx="14" cy="40" r="7" fill="#35C98A"/>
  <path d="M20 48c-5-3-8-9-8-15 0-5 2-10 6-14" fill="none" stroke="#35C98A" stroke-width="7" stroke-linecap="round"/>
</g></g>
<text x="800" y="490" text-anchor="middle" style="font-size:46px;font-weight:850">SafeCircle</text>
<text x="800" y="535" text-anchor="middle" class="body">정보를 이해 가능한 형태로 전달하고</text>
<text x="800" y="570" text-anchor="middle" class="body">필요한 사람과 기관으로 연결</text>

<rect x="130" y="205" width="430" height="205" rx="30" fill="#EEF5FF" stroke="#CFE0F6" stroke-width="2"/>
<circle cx="220" cy="290" r="52" fill="#DCEBFF"/><circle cx="203" cy="274" r="12" fill="#2F80ED"/><circle cx="237" cy="274" r="12" fill="#35C98A"/><path d="M184 319c10-28 62-28 72 0" fill="none" stroke="#66758A" stroke-width="8" stroke-linecap="round"/>
