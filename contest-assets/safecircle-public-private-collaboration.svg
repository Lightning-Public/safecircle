<text x="300" y="313" class="body">상황 확인 · 의사소통</text>
<text x="300" y="348" class="body">안전상태·도움 요청</text>

<rect x="1040" y="205" width="430" height="205" rx="30" fill="#FFF7E8" stroke="#F0DFC2" stroke-width="2"/>
<circle cx="1130" cy="290" r="52" fill="#FFF0CC"/><path d="M1098 317v-45l32-20 32 20v45M1112 317v-25h36v25M1107 280h9M1144 280h9" stroke="#F2B134" stroke-width="7" fill="none" stroke-linejoin="round"/>
